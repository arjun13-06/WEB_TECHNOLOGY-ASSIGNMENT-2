<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Student Registration</h1>
    <p class="subtitle">Enter your details to register.</p>
    <form id="registrationForm" novalidate>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" placeholder="Enter your full name" required>
      <small class="error" id="nameError"></small>

      <label for="roll">Roll number</label>
      <input id="roll" name="roll" type="text" placeholder="e.g. 23CSE101" required>
      <small class="error" id="rollError"></small>

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="name@example.com" required>
      <small class="error" id="emailError"></small>

      <label for="course">Course</label>
      <select id="course" name="course" required>
        <option value="">Select your course</option>
        <option>CSE</option><option>IT</option><option>ECE</option><option>EEE</option><option>Mechanical</option>
      </select>
      <small class="error" id="courseError"></small>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="At least 8 characters" required>
      <small class="hint">Use 8+ characters with uppercase, lowercase, number and symbol.</small>
      <small class="error" id="passwordError"></small>

      <label for="document">Upload student document (PDF/JPG/PNG, max 2 MB)</label>
      <input id="document" name="document" type="file" accept=".pdf,.jpg,.jpeg,.png" required>
      <small class="error" id="documentError"></small>

      <button type="submit">Register</button>
      <p id="successMessage" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
